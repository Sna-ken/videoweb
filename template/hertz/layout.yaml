layouts:
  - path: cmd/api/main.go
    delims:
      - "{{"
      - "}}"
    body: |-
      // Code generated by hertz generator.

      package main

      import (
          "{{.GoModule}}/api/router"
          "github.com/cloudwego/hertz/pkg/app/server"
      )

      func main() {
          h := server.Default()
          router.Register(h)
          h.Spin()
      }

  - path: api/router/router.go
    delims:
      - ""
      - ""
    body: |-
      // Code generated by hertz generator.

      package router

      import "github.com/cloudwego/hertz/pkg/app/server"

      // CustomizedRegister registers routes that are not defined in IDL.
      func CustomizedRegister(r *server.Hertz) {
          // Register custom routes here.
      }

  - path: api/router/router_gen.go
    delims:
      - ""
      - ""
    body: |-
      // Code generated by hertz generator. DO NOT EDIT.

      package router

      import "github.com/cloudwego/hertz/pkg/app/server"

      // Register registers generated and customized routes.
      func Register(r *server.Hertz) {
          GeneratedRegister(r)
          CustomizedRegister(r)
      }

  - path: api/router/register.go
    delims:
      - ""
      - ""
    body: |-
      // Code generated by hertz generator. DO NOT EDIT.

      package router

      import "github.com/cloudwego/hertz/pkg/app/server"

      // GeneratedRegister registers routes generated from IDL.
      func GeneratedRegister(r *server.Hertz) {
          //INSERT_POINT: DO NOT DELETE THIS LINE!
      }

  - path: api/build.sh
    delims:
      - ""
      - ""
    body: |-
      #!/usr/bin/env bash
      set -e

      PROJECT_ROOT=$(cd "$(dirname "$0")/.." && pwd)
      OUTPUT_DIR="$PROJECT_ROOT/output"

      mkdir -p "$OUTPUT_DIR/bin"
      cp "$PROJECT_ROOT/api/script/"* "$OUTPUT_DIR" 2>/dev/null || true
      chmod +x "$OUTPUT_DIR/bootstrap.sh"
      go build -o "$OUTPUT_DIR/bin/api" "$PROJECT_ROOT/cmd/api"

  - path: api/script/bootstrap.sh
    delims:
      - ""
      - ""
    body: |-
      #!/usr/bin/env bash

      CURDIR=$(cd "$(dirname "$0")" && pwd)
      exec "$CURDIR/bin/api"
