services:
  mysql:
    image: mysql:8.0
    container_name: videoweb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: videoweb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/sql/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      - videoweb

  redis:
    image: redis:7-alpine
    container_name: video_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - videoweb

volumes:
  mysql_data:
  redis_data: